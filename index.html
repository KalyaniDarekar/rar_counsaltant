<!doctype html>
<html lang="en" data-theme="cyan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060b14" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="RAR Consultant" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <title>RAR Consultant | All IT Solutions Under One Roof</title>
    <script>
      try {
        const p = new URLSearchParams(window.location.search).get('theme') || localStorage.getItem('rar_theme_v2') || 'cyan';
        document.documentElement.setAttribute('data-theme', p);
      } catch {}
      (() => {
        const url = new URL(window.location.href);
        const requested = url.searchParams.get('p');
        if (requested && requested.startsWith('/') && !requested.startsWith('//')) {
          window.history.replaceState(null, '', requested);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
